<ion-header>
  <ion-toolbar>
    <ion-title>To-Do List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-input
      placeholder="Nueva tarea"
      [(ngModel)]="newTaskTitle"
      (keyup.enter)="addTask()"
    ></ion-input>
    <ion-button slot="end" (click)="addTask()">Agregar</ion-button>
  </ion-item>

  <ion-list>
    <ion-item *ngFor="let task of tasks">
      <ion-checkbox
        slot="start"
        [(ngModel)]="task.selected"
        [disabled]="task.completed"
      ></ion-checkbox>

      <ion-label [class.completed]="task.completed">
        {{ task.title }}
      </ion-label>

      <ion-button
        fill="clear"
        color="danger"
        slot="end"
        (click)="deleteTask(task.id)"
      >
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
<ion-footer *ngIf="hasSelectedTasks()">
  <ion-toolbar>
    <ion-button expand="block" color="success" (click)="completeSelected()">
      Completar {{ selectedCount() === 1 ? 'tarea seleccionada' : 'tareas
      seleccionadas' }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
