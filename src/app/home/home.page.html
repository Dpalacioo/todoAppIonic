<ion-header>
  <ion-toolbar>
    <ion-title>To-Do List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label>Filtrar por</ion-label>
    <ion-select [(ngModel)]="filterCategoryId" (ionChange)="onFilterChange()">
      <ion-select-option value="all">Todas</ion-select-option>

      <ion-select-option
        *ngFor="let category of categories"
        [value]="category.id"
      >
        {{ category.name }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-input
      placeholder="Nueva tarea"
      [(ngModel)]="newTaskTitle"
      (keyup.enter)="addTask()"
    >
    </ion-input>
  </ion-item>

  <ion-item>
    <ion-label>Categoría</ion-label>
    <ion-select [(ngModel)]="selectedCategoryId">
      <ion-select-option
        *ngFor="let category of categories"
        [value]="category.id"
      >
        {{ category.name }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-button
    expand="block"
    (click)="addTask()"
    [disabled]="!newTaskTitle.trim()"
  >
    Agregar tarea
  </ion-button>

  <ion-list>
    <ion-card *ngFor="let task of tasks" class="task-card">
      <ion-card-content>
        <ion-item lines="none">
          <ion-checkbox
            slot="start"
            [(ngModel)]="task.selected"
            [disabled]="task.completed"
          >
          </ion-checkbox>

          <ion-label [class.completed]="task.completed">
            <h2>{{ task.title }}</h2>
            <p>{{ getCategoryName(task.categoryId) }}</p>
          </ion-label>

          <ion-button
            fill="clear"
            color="danger"
            slot="end"
            (click)="deleteTask(task.id)"
          >
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </ion-list>

  <!-- 🔥 MOVIDO DENTRO DEL CONTENT -->
  <ion-button
    *ngIf="hasSelectedTasks()"
    expand="block"
    color="success"
    (click)="completeSelected()"
  >
    Completar {{ selectedCount() === 1 ? 'tarea seleccionada' : 'tareas
    seleccionadas' }}
  </ion-button>
</ion-content>
