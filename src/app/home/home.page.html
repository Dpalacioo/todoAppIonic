<ion-header>
  <ion-toolbar>
    <ion-title>To-Do List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Crear tarea -->
  <ion-item>
    <ion-input
      placeholder="Nueva tarea"
      [(ngModel)]="newTaskTitle"
      (keyup.enter)="addTask()"
    ></ion-input>
  </ion-item>

  <!-- Selector de categoría -->
  <ion-item>
    <ion-label>Categoría</ion-label>
    <ion-select [(ngModel)]="selectedCategoryId">
      <ion-select-option
        *ngFor="let category of categories"
        [value]="category.id"
      >
        {{ category.name }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-button
    expand="block"
    (click)="addTask()"
    [disabled]="!newTaskTitle.trim()"
  >
    Agregar tarea
  </ion-button>

  <!-- Lista de tareas -->
  <ion-list>
    <ion-item *ngFor="let task of tasks">
      <ion-checkbox
        slot="start"
        [(ngModel)]="task.selected"
        [disabled]="task.completed"
      ></ion-checkbox>

      <ion-label [class.completed]="task.completed">
        <h2>{{ task.title }}</h2>
        <p>Categoría: {{ getCategoryName(task.categoryId) }}</p>
      </ion-label>

      <ion-button
        fill="clear"
        color="danger"
        slot="end"
        (click)="deleteTask(task.id)"
      >
        <ion-icon name="trash-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>

<!-- Footer acción masiva -->
<ion-footer *ngIf="hasSelectedTasks()">
  <ion-toolbar>
    <ion-button expand="block" color="success" (click)="completeSelected()">
      Completar {{ selectedCount() === 1 ? 'tarea seleccionada' : 'tareas
      seleccionadas' }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
